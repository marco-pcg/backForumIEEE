services:
  postgres:
    image: postgres:latest
    container_name: agora-postgres
    restart: always
    environment:
      POSTGRES_DB: webdev2
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5532:5432"

  redis:
    image: redis:latest
    container_name: agora-redis
    ports:
      - "6479:6379"
    volumes:
      - redis_data:/var/data
    restart: always
  node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agora-node
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: localhost
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: docker
      DB_PASSWORD: docker
      DB_NAME: webdev2
      REDIS_HOSt: redis
      REDIS_PORT: 6379
      DATABASE_URL: "postgresql://docker:docker@postgres:5432/webdev2?schema=public"
      SECRET_KEY: supersecretkey
      ACCESS_TOKEN_SECRET: "anotherbigsecretkey"
      REFRESH_TOKEN_SECRET: "anotherbigsecretkey"
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - postgres
      


volumes:
  postgres_data:
  redis_data: